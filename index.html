<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Sınav Hazırlayıcı</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- YÜKLEME EKRANI -->
  <div id="upload-screen" class="quiz-container">
    <h2>📄 Sınav PDF'i Yükle</h2>
    <p class="upload-desc">Metin veya Görsel (Taranmış) PDF dosyanızı seçin.</p>
    
    <div class="drop-zone" onclick="document.getElementById('pdf-input').click()">
      <span class="file-icon">📥</span>
      <span>PDF Dosyası Seçin</span>
      <input type="file" id="pdf-input" accept="application/pdf" style="display: none;">
    </div>
    <div id="loading-status" class="status-text"></div>
  </div>

  <!-- ÖN İZLEME VE MANUEL DÜZENLEME EKRANI -->
  <div id="edit-screen" class="quiz-container hidden">
    <h2>✏️ Soruları Gözden Geçir ve Onayla</h2>
    <p class="upload-desc">Gemini'nin çıkardığı soruları inceleyip gerekirse düzenleyebilirsiniz.</p>
    
    <div id="edit-list" class="edit-list-container"></div>

    <button class="nav-btn restart-btn" onclick="confirmQuestions()">Testi Başlat ▶</button>
  </div>

  <!-- TEST ÇÖZME EKRANI -->
  <div id="quiz-screen" class="quiz-container hidden">
    <div class="quiz-header">
      <span id="category" class="badge">PDF Sınavı</span>
      <span id="progress">Soru 1 / 0</span>
    </div>

    <div class="question-box">
      <p id="question-text">Soru yükleniyor...</p>
    </div>

    <div id="options-container" class="options-grid"></div>

    <div class="quiz-footer">
      <button id="prev-btn" class="nav-btn" onclick="changeQuestion(-1)" disabled>◀ Önceki</button>
      <button id="next-btn" class="nav-btn" onclick="changeQuestion(1)">Sonraki ▶</button>
    </div>
  </div>

  <!-- ANALİZ VE SONUÇ EKRANI -->
  <div id="result-screen" class="quiz-container hidden">
    <div class="result-header">
      <h2>Test Analizi</h2>
      <div class="score-badge" id="score-text">%0</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card correct">
        <span class="stat-value" id="correct-count">0</span>
        <span class="stat-label">Doğru</span>
      </div>
      <div class="stat-card wrong">
        <span class="stat-value" id="wrong-count">0</span>
        <span class="stat-label">Yanlış</span>
      </div>
      <div class="stat-card empty">
        <span class="stat-value" id="empty-count">0</span>
        <span class="stat-label">Boş</span>
      </div>
    </div>

    <h3 style="margin-bottom: 15px; color: #3c4043;">Soru Detayları</h3>
    <div id="analysis-list" class="analysis-container"></div>

    <button class="nav-btn restart-btn" onclick="restartQuiz()">Yeni PDF Yükle</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
